<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:">
<title>Replay</title>
<style>
/*FONTS*/
/* Measured from T3 Code's dark theme and its sidebar (apps/web/src/index.css)
   and a screenshot of the running app. */
:root {
  --bg: #000;
  --sidebar: #020202;
  --edge: #111;
  --fg: #f1f3f7;
  --text: #e5e5e5;
  --title-recede: #b5b5b8;
  --label: #a1a1a1;
  --project: #838383;
  --faint: #6f6f6f;
  --branch: #8d8d8d;
  --icon: #8a8a8a;
  --row-active: #1e1e1e;
  --bubble: #1e1e1e;
  --composer: #141414;
  --composer-edge: #1d1d1d;
  --card: #0f0f0f;
  --card-edge: #181818;
  --rule: #121212;
  --code-bg: #171717;
  --block-bg: #090909;
  --block-edge: #161616;
  --send: #2a2a2a;
  --info: #51a2ff;
  --success: #00d492;
  --error: #f26b6b;
  --add: #00d492;
  --del: #ff6467;
  --claude: #d97757;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t: 0; /* playback seconds: every continuous motion is a function of it */
}
:root[data-theme="light"] {
  --bg: #fcfcfc; --sidebar: #fafafa; --edge: #e4e4e7; --fg: #27272a; --text: #27272a; --title-recede: #52525b;
  --label: #71717a; --project: #71717a; --faint: #a1a1aa; --branch: #a1a1aa; --icon: #71717a;
  --row-active: #fff; --bubble: #f4f4f5; --composer: #fff; --composer-edge: #e4e4e7; --card: #fff; --card-edge: #e4e4e7;
  --rule: #ececee; --code-bg: #f4f4f5; --block-bg: #fafafa; --block-edge: #e4e4e7; --send: #e4e4e7;
  --info: #2563eb; --success: #059669; --error: #dc2626; --add: #059669; --del: #dc2626;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: var(--sans); color: var(--fg); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "calt"; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#viewport { position: fixed; inset: 0; display: grid; place-items: center; }
#stage { position: relative; display: flex; overflow: hidden; background: var(--bg); flex: none; }

/* ---- Sidebar ---- */
#sidebar { width: 253px; flex: none; background: var(--sidebar); border-right: 1px solid var(--edge); display: flex; flex-direction: column; }
.sb-top { height: 38px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 0 0 20px; color: var(--icon); }
.sb-top .brand { color: var(--fg); font-size: 15px; letter-spacing: -0.01em; margin-left: 2px; }
.sb-top .brand b { font-weight: 700; }
.sb-top .brand span { font-weight: 500; }
.sb-top .nav { display: flex; gap: 12px; margin-left: 6px; }
.sb-search { height: 34px; flex: none; margin: 10px 10px 6px; display: flex; align-items: center; gap: 10px; padding: 0 8px; color: var(--label); font-size: 15px; }
.sb-search .grow { flex: 1; }
.sb-search .tools { display: flex; gap: 12px; color: var(--icon); }
#rows { position: relative; flex: 1; margin: 6px 10px 0; overflow: hidden; }
.shelf-bg { position: absolute; left: -10px; right: -10px; bottom: 0; background: var(--sidebar); z-index: 1; }
.shelf { z-index: 2; position: absolute; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 14.5px; color: var(--label); }
.shelf .n { margin-left: auto; font-variant-numeric: tabular-nums; }
.shelf svg.i { width: 14px; height: 14px; }
.row { position: absolute; left: 0; right: 0; height: 78px; border-radius: 6px; padding: 8px 10px; will-change: transform, opacity; }
.row.moving { background: var(--sidebar); box-shadow: 0 0 0 1px var(--sidebar); }
.row.active { background: var(--row-active); }
.row .l1 { height: 20px; display: flex; align-items: center; gap: 6px; }
.row .proj { flex: 1; min-width: 0; font-size: 12px; font-weight: 500; color: var(--project); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .st { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.row .st.time { color: var(--faint); font-weight: 400; }
.row .st.working { color: var(--info); }
.row .st.done { color: var(--success); }
.row .st.failed { color: var(--error); }
.row .st svg.i { width: 15px; height: 15px; }
.row .st.working svg.i { transform: rotate(calc(var(--t) * 90deg)); }
.row.compact { height: 61px; }
.row .l2 { margin-top: 4px; height: 21px; display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 500; color: var(--fg); white-space: nowrap; }
.row .l2 .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row.recede .l2 { color: var(--title-recede); font-weight: 400; }
.row.recede.working { opacity: 0.7; }
.row.active .l2 { color: var(--fg); font-weight: 600; }
.row .l3 { margin-top: 3px; height: 18px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--branch); }
.row .l3 svg.i { width: 13px; height: 13px; color: var(--faint); }
.row .l3 .br { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prov { width: 15px; height: 15px; flex: none; }
.mono { width: 16px; height: 16px; flex: none; border-radius: 4px; display: grid; place-items: center; font-family: var(--mono); font-size: 8.5px; font-weight: 800; letter-spacing: -0.02em; }
.mono.emoji { font-size: 13px; font-family: var(--sans); }
.sb-settled { height: 40px; flex: none; display: flex; align-items: center; padding: 0 20px; font-size: 14.5px; color: var(--label); gap: 8px; }
.sb-settled .grow { flex: 1; }
.sb-settled .n { font-variant-numeric: tabular-nums; display: inline-block; }
.sb-foot { height: 48px; flex: none; display: flex; align-items: center; gap: 20px; padding: 0 20px; color: var(--icon); }
.sb-foot .grow { flex: 1; }
.sb-foot svg.i { width: 17px; height: 17px; }

/* ---- Main ---- */
#main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mn-top { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 20px; font-size: 14.5px; }
.mn-top .crumb { color: var(--label); white-space: nowrap; }
.mn-top .sep { color: var(--faint); }
.mn-top .title { color: var(--fg); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mn-top .grow { flex: 1; }
.mn-top .tools { display: flex; gap: 14px; align-items: center; color: var(--icon); }
.mn-top .close { width: 22px; height: 22px; border-radius: 50%; background: #1a1a1a; color: var(--fg); display: grid; place-items: center; }
.mn-top .close svg.i { width: 12px; height: 12px; stroke-width: 2.5; }
#card { position: absolute; right: 10px; top: 50px; width: 274px; background: var(--card); border: 1px solid var(--card-edge); border-radius: 10px; padding: 6px; z-index: 2; }
#card .it { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 13.5px; color: #d4d4d4; white-space: nowrap; }
#card .it svg.i { color: var(--icon); }
#card .it .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#card .it .chev { width: 13px; height: 13px; }
#card hr { border: 0; border-top: 1px solid var(--card-edge); margin: 6px 4px; }
#convo { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
#items { width: 720px; margin: 0 auto; padding: 24px 0 12px; display: flex; flex-direction: column; }
.block { overflow: hidden; flex: none; }
.block > .inner { padding: 6px 0; }
.user > .inner { display: flex; justify-content: flex-end; padding-top: 10px; }
.user .bubble { max-width: 580px; background: var(--bubble); border-radius: 14px; padding: 11px 14px; font-size: 15px; line-height: 1.5; color: #f3f3f3; white-space: pre-wrap; word-wrap: break-word; max-height: 13.5em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 2.5em), transparent); }
.user .bubble.short { -webkit-mask-image: none; }
.fold > .inner { display: flex; align-items: center; gap: 4px; padding: 10px 2px 10px; border-bottom: 1px solid var(--rule); font-size: 15px; color: #9e9e9e; font-variant-numeric: tabular-nums; }
.fold svg.i { width: 14px; height: 14px; color: var(--faint); }
.assistant { font-size: 15px; line-height: 1.55; color: var(--text); word-wrap: break-word; }
.assistant p { margin: 0 0 12px; }
.assistant > :last-child { margin-bottom: 0; }
.assistant ul, .assistant ol { margin: 0 0 12px; padding-left: 20px; }
.assistant li { margin: 3px 0; padding-left: 2px; }
.assistant h3 { font-size: 15px; margin: 16px 0 6px; font-weight: 600; color: var(--fg); }
.assistant strong { font-weight: 600; color: var(--fg); }
.assistant code { font-family: var(--mono); font-size: 13px; background: var(--code-bg); border-radius: 5px; padding: 1.5px 5px; color: #d4d4d4; }
.assistant pre { font-family: var(--mono); font-size: 13px; line-height: 1.6; background: var(--block-bg); border: 1px solid var(--block-edge); border-radius: 10px; padding: 12px 16px; margin: 0 0 12px; overflow: hidden; white-space: pre; max-height: 15em; color: #d4d4d4; }
.assistant pre code { background: none; padding: 0; }
.question { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #9e9e9e; white-space: nowrap; }
.question span { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.work > .inner { padding: 2px 0; }
.line { overflow: hidden; }
.line > .inner { display: flex; align-items: center; gap: 10px; height: 28px; font-size: 14px; color: var(--label); white-space: nowrap; padding-left: 2px; }
.line svg.i { width: 15px; height: 15px; color: var(--faint); }
.line .verb { flex: none; color: #cfcfcf; font-weight: 500; }
.line .subj { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 12.5px; color: var(--branch); }
.line .det { flex: none; font-family: var(--mono); font-size: 12.5px; color: var(--faint); }
.line .det .a { color: var(--add); } .line .det .d { color: var(--del); }
.line.running .verb, .live .label { background: linear-gradient(90deg, #8a8a8a 0%, #f4f4f4 50%, #8a8a8a 100%); background-size: 200% 100%; background-position: calc(100% - mod(var(--t) * 90%, 200%)) 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
.line.failed .det { color: var(--error); }
.error-card { border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 1.5; color: var(--error); border: 1px solid color-mix(in srgb, var(--error) 35%, transparent); white-space: pre-wrap; }
.notice { text-align: center; font-size: 13px; color: var(--faint); }
.live > .inner { display: flex; align-items: baseline; gap: 5px; padding: 8px 2px 10px; border-bottom: 1px solid var(--rule); font-size: 15px; color: #9e9e9e; font-variant-numeric: tabular-nums; }
#composer { width: 724px; margin: 0 auto 20px; flex: none; }
#composer .box { border: 1px solid var(--composer-edge); background: var(--composer); border-radius: 20px; padding: 15px 16px 10px; }
#composer .text { min-height: 46px; max-height: 92px; overflow: hidden; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; color: var(--fg); }
#composer .text.placeholder { color: #8f8f8f; }
#composer .caret { display: inline-block; width: 1.5px; height: 1.15em; vertical-align: text-bottom; background: var(--fg); margin-left: 1px; }
#composer .foot { display: flex; align-items: center; gap: 14px; margin-top: 2px; font-size: 14.5px; color: var(--label); }
#composer .foot .grow { flex: 1; }
#composer .model { display: inline-flex; align-items: center; gap: 7px; color: #e5e5e5; }
#composer .model .eff { color: var(--label); }
#composer .send { width: 30px; height: 30px; border-radius: 50%; background: var(--send); color: #8a8a8a; display: grid; place-items: center; }
#composer .send.ready { background: var(--fg); color: #000; }
#composer .send svg.i { width: 15px; height: 15px; stroke-width: 2.4; }
#clock { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 10px; padding: 2px 9px; }

/* Playback controls: off in frame mode, shown on hover otherwise. */
#controls { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: linear-gradient(to top, rgb(0 0 0 / 70%), transparent); color: #fff; font: 12px var(--sans); opacity: 0; transition: opacity .2s; z-index: 10; }
body:hover #controls { opacity: 1; }
body.frame #controls { display: none; }
#controls button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
#controls button.on { background: rgb(255 255 255 / 18%); }
#rows.reflow .row, #rows.reflow .shelf { transition: transform .5s cubic-bezier(.65,0,.35,1), opacity .5s; }
#bar { flex: 1; height: 4px; border-radius: 2px; background: rgb(255 255 255 / 25%); cursor: pointer; position: relative; }
#bar > div { position: absolute; inset: 0 auto 0 0; background: #fff; border-radius: 2px; }
</style>
</head>

<script>
"use strict";
const T = /*TIMELINE*/null;
const PB = T.playback;
document.documentElement.dataset.theme = PB.theme;
const stage = document.getElementById("stage");
stage.style.width = PB.width + "px";
stage.style.height = PB.height + "px";
const PARAMS = new URLSearchParams(location.search);
const FRAME = PARAMS.has("frame"); // filming: no clock of its own, no controls
if (FRAME) document.body.classList.add("frame");

// ---- Time: real milliseconds <-> playback seconds ----------------------
// Every moment something happens is a key. Between two keys real time plays
// at PB.speed, but no gap plays longer than PB.gapCap; PB.duration then scales

    r.el.style.zIndex = at.dir < 0 ? "4" : at.dir > 0 ? "3" : at.shelf ? "2" : "";
    r.el.classList.toggle("moving", !!at.dir);
    const active = th.id === T.focus;
    r.el.classList.toggle("recede", !active && (s.status === "idle" || s.status === "working"));
    r.el.classList.toggle("working", s.status === "working");
    let cls = "st time", html;
    if (s.status === "working") { cls = "st working"; html = ICON.working + "<span>Working</span><span>" + short(real - s.since) + "</span>"; }
    else if (s.status === "done") { cls = "st done"; html = ICON.done + "<span>Done</span>"; }
    else if (s.status === "failed") { cls = "st failed"; html = ICON.failed + "<span>Failed</span>"; }
    else html = ago(real - s.last);
    if (cls + html !== r.html) { r.st.className = cls; r.st.innerHTML = html; r.html = cls + html; }
  }
  settledEl.textContent = String(settled);
  for (const [key, sh] of shelfEls) {
    const at = placeAt(p, "shelf:" + key);
    if (!at || at.o <= 0) { sh.el.style.opacity = "0"; if (key === "working") shelfBg.style.opacity = "0"; continue; }
    sh.el.style.opacity = String(at.o);
    sh.el.style.transform = "translateY(" + at.y.toFixed(2) + "px)";
    sh.n.textContent = at.n ? String(at.n) : "";
    if (key === "working") { shelfBg.style.top = at.y.toFixed(2) + "px"; shelfBg.style.opacity = String(at.o); }
  }
}

// ---- Header, card and composer ----------------------------------------
const focus = threads.find((th) => th.id === T.focus);
const focusProject = focus && projects.get(focus.project);
document.getElementById("h-mono").outerHTML = projectBadge(focusProject);
document.getElementById("h-project").textContent = focusProject ? focusProject.title : "No project";
document.getElementById("h-title").textContent = T.title || (focus ? focus.title : "");
if (focus && focus.branch) document.querySelector("#card-branch .grow").textContent = focus.branch;
else document.getElementById("card-branch").remove();
const modelEl = document.getElementById("c-model");
if (T.model) {
  const sp = T.model.lastIndexOf(" ");
  const effort = /^(Low|Medium|High|Max|Xhigh|Minimal)$/.test(T.model.slice(sp + 1)) ? T.model.slice(sp + 1) : "";
  modelEl.innerHTML = (focus && PROVIDER[focus.agent] || "") + "<span></span>" + (effort ? '<span class="eff"></span>' : "");
  modelEl.children[modelEl.children.length - (effort ? 2 : 1)].textContent = effort ? T.model.slice(0, sp) : T.model;
  if (effort) modelEl.lastChild.textContent = effort;
}
const PLACEHOLDER = "Ask anything. @ files, $ skills, / commands";

// ---- Conversation ------------------------------------------------------
// The focus thread's items, grouped by run: a prompt and the agent's work
// up to its next prompt. While a run works, its work streams in; once it
// finishes, the work folds into "Worked for …" above the final reply.
const APPEAR = 0.35, FOLD = 0.5, STREAM_MAX = 1.6, TYPE_MAX = 1.6;
const items = T.items.map((it) => ({ ...it, p: toPlay(Date.parse(it.at)), real: Date.parse(it.at), doneP: it.done ? toPlay(Date.parse(it.done)) : Infinity, history: Date.parse(it.at) < FROM }));
items.sort((a, b) => a.real - b.real);
// The focus thread's working spells, from its status changes. A spell under
// way at the window's start began before it (-Infinity).
const spells = [];
{
  let ws = null, first = true;
  for (const c of focus ? focus.changes : []) {
    if (c.status === undefined) continue;
    const atStart = first && c.real <= FROM;
    first = false;
    if (c.status === "working") { if (ws === null) ws = atStart ? -Infinity : c.real; }
    else if (ws !== null) { spells.push({ ws, we: c.real }); ws = null; }
  }
  if (ws !== null) spells.push({ ws, we: Infinity });
}
// A run is one working spell and what happened in it: the prompt that began
// it (a run can also start without one, when the agent is woken) and the
// work. Items from before the window, outside any known spell, are grouped
// by prompt and already folded.
const runs = [];
for (const it of items) {
  const spell = spells.find((v) => it.real >= v.ws - 3000 && it.real <= v.we + 500);
  let run = runs[runs.length - 1];
  if (spell ? !run || run.spell !== spell : it.kind === "user" || !run) {
    run = { spell, user: it.kind === "user" ? it : null, start: spell && spell.ws !== -Infinity ? Math.min(spell.ws, it.real) : it.real, items: [] };
    runs.push(run);
    if (run.user) continue;
  }
  run.items.push(it);
}
for (const run of runs) {
  const last = run.items.length ? run.items[run.items.length - 1].real : run.start;
  if (run.spell) {
    run.endReal = run.spell.we;
    run.folded = false;
  } else {
    run.folded = last < FROM; // history: finished before the window
    run.endReal = run.folded ? FROM : Infinity;
  }
  run.endP = run.endReal === Infinity ? Infinity : run.folded ? 0 : toPlay(run.endReal);
  const replies = run.items.filter((it) => it.kind === "assistant" && it.real <= run.endReal);
  run.final = replies.length ? replies[replies.length - 1] : null;
  run.workedFor = dur((run.folded ? last : run.endReal) - run.start);
  run.foldable = run.folded || (run.spell && run.endReal !== Infinity);
}
const itemsEl = document.getElementById("items");
function shell(cls) {
  const outer = document.createElement("div");
  outer.className = cls;
  outer.style.display = "none";
  const inner = document.createElement("div");
  inner.className = "inner";
  outer.appendChild(inner);
  itemsEl.appendChild(outer);
  return { outer, inner };
}
// Every block knows when it appears and, if it folds away, when.
const blocks = [];
function addBlock(cls, p, history, fill, foldP) {
  const { outer, inner } = shell(cls);
  const b = { el: outer, inner, p, history, foldP: foldP ?? Infinity };
  fill(inner, b);
  blocks.push(b);
  return b;
}
for (const run of runs) {
  const runP = run.user ? run.user.p : run.items.length ? run.items[0].p : 0;
  if (run.user) {
    const text = run.user.text;
    addBlock("block user", run.user.p, run.user.history, (inner) => {
      inner.innerHTML = '<div class="bubble' + (text.split("\n").length < 12 && text.length < 900 ? " short" : "") + '"></div>';
      inner.firstChild.textContent = text;
    });
  }
  // The fold line: present once the run has finished.
  if (run.foldable) {
    addBlock("block fold", run.folded ? runP : run.endP, run.folded, (inner) => {
      inner.innerHTML = "<span></span>" + ICON.chev;
      inner.firstChild.textContent = "Worked for " + run.workedFor;
    });
    run.foldBlock = blocks[blocks.length - 1];
  }
  let work = null;
  for (const it of run.items) {
    const folds = run.foldable && it !== run.final && it.kind !== "question" && it.kind !== "user" ? run.endP : Infinity;
    if (it.kind === "tool") {
      if (!work) work = addBlock("block work", it.p, it.history, (inner) => {}, folds);
      const wb = work;
      const { outer, inner } = (() => {
        const outer = document.createElement("div");
        outer.className = "line";
        outer.style.display = "none";
        const inner = document.createElement("div");
        inner.className = "inner";
        outer.appendChild(inner);
        wb.inner.appendChild(outer);
        return { outer, inner };
      })();
      let det = "";
      if (it.detail) {
        const m = /^\+(\d+) -(\d+)$/.exec(it.detail);
        det = m ? '<span class="a">+' + m[1] + '</span> <span class="d">−' + m[2] + "</span>" : esc(it.detail);
      }
      inner.innerHTML = (ICON[it.verb] || ICON.Called) + '<span class="verb">' + esc(it.verb || "") + '</span><span class="subj">' + esc(it.text) + '</span><span class="det">' + det + "</span>";
      (wb.lines ||= []).push({ el: outer, inner, it });
      continue;
    }
    work = null;
    if (it.kind === "assistant") {
      addBlock("block", it.p, it.history, (inner, b) => {
        inner.innerHTML = '<div class="assistant"></div>';
        b.body = inner.firstChild;
        b.text = it.text;
        b.streamLen = Math.max(0.25, Math.min(STREAM_MAX, nextKeyAfter(it.p) - it.p));
        b.shown = -1;
      }, folds);
    } else if (it.kind === "user") { // a prompt sent while the agent works
      addBlock("block user", it.p, it.history, (inner) => { inner.innerHTML = '<div class="bubble short"></div>'; inner.firstChild.textContent = it.text; });
    } else if (it.kind === "question") {
      addBlock("block", it.p, it.history, (inner) => {
        inner.innerHTML = '<div class="question">' + ICON.chat + "<span></span>" + ICON.chev + "</div>";
        inner.querySelector("span").textContent = it.text;
      });
    } else if (it.kind === "error") {
      addBlock("block", it.p, it.history, (inner) => { inner.innerHTML = '<div class="error-card"></div>'; inner.firstChild.textContent = it.text; }, folds);
    } else {
      addBlock("block", it.p, it.history, (inner) => { inner.innerHTML = '<div class="notice"></div>'; inner.firstChild.textContent = it.text; }, folds);
    }
  }
  // The final reply belongs below the fold line: move the fold before it.
  if (run.foldBlock && run.final) {
    const finalBlock = blocks.find((b) => b.text === run.final.text && b.p === run.final.p);
    if (finalBlock) itemsEl.insertBefore(run.foldBlock.el, finalBlock.el);
  }
  if (run.folded) for (const b of blocks) if (b.foldP === run.endP) b.foldP = -Infinity;
}
// The live "Working for …" line under the newest work.
const live = shell("block live");
live.inner.innerHTML = '<span class="label">Working for</span><span class="for"></span>';
const liveFor = live.inner.querySelector(".for");
function liveRunAt(p) {
  for (const r of runs) if (r.spell && toPlay(r.start) <= p && p < r.endP) return r;
  return null;
}
// Open a block over APPEAR seconds from its start; fold it shut over FOLD
// seconds from foldP.
function size(el, inner, p, start, history, foldP) {
  if (foldP === -Infinity || (!history && p < start)) { el.style.display = "none"; return false; }
  let k = history ? 1 : progress(p, start, APPEAR);
  if (p >= foldP) k = Math.min(k, 1 - easeInOut((p - foldP) / FOLD));
  if (k <= 0) { el.style.display = "none"; return false; }
  el.style.display = "";
  if (k >= 1) { el.style.height = ""; el.style.opacity = ""; return true; }
  el.style.height = (inner.offsetHeight * k).toFixed(2) + "px";
  el.style.opacity = String(Math.min(1, k * 1.4));
  return true;
}
function renderConversation(p, real) {
  for (const b of blocks) {
    if (b.body) {
      const k = b.history ? 1 : Math.min(1, Math.max(0, (p - b.p) / b.streamLen));
      const n = k >= 1 ? b.text.length : Math.floor(b.text.length * k);
      if (n !== b.shown) { b.body.innerHTML = markdown(b.text.slice(0, n)); b.shown = n; }
    }
    if (b.lines) for (const ln of b.lines) {
      size(ln.el, ln.inner, p, ln.it.p, ln.it.history, Infinity);
      ln.el.classList.toggle("running", !ln.it.history && p >= ln.it.p && p < ln.it.doneP);
      ln.el.classList.toggle("failed", !!ln.it.failed && p >= ln.it.doneP);
    }
    size(b.el, b.inner, p, b.p, b.history, b.foldP);
  }
  const run = liveRunAt(p);
  if (run) {
    size(live.outer, live.inner, p, toPlay(run.start) + 0.15, run.start < FROM, Infinity);
    liveFor.textContent = dur(real - run.start);
  } else live.outer.style.display = "none";
  itemsEl.appendChild(live.outer);
}

// ---- Composer ----------------------------------------------------------
const cText = document.getElementById("c-text"), cSend = document.getElementById("c-send");
const prompts = items.filter((it) => it.kind === "user" && !it.history).map((it) => ({ ...it, typeLen: Math.max(0.25, Math.min(TYPE_MAX, it.p - prevKeyBefore(it.p))) }));
let composerKey = null;
function renderComposer(p) {
  const next = prompts.find((it) => p < it.p && p >= it.p - it.typeLen);
  let key = "", text = "";
  if (next) {
    const full = next.text.length > 240 ? next.text.slice(0, 240) + "…" : next.text;
    const n = Math.ceil(full.length * Math.min(1, (p - (next.p - next.typeLen)) / (next.typeLen * 0.85)));
    text = full.slice(0, n);
    key = next.id + ":" + n;
  }
  if (key === composerKey) return;
  composerKey = key;
  if (text) {
    cText.classList.remove("placeholder");
    cText.textContent = text;
    const caret = document.createElement("span");
    caret.className = "caret";
    cText.appendChild(caret);
  } else {
    cText.classList.add("placeholder");
    cText.textContent = PLACEHOLDER;
  }
  cSend.classList.toggle("ready", !!text);
}

// ---- Frame -------------------------------------------------------------
const clockEl = document.getElementById("clock");
clockEl.hidden = !PB.clock;
function render(p) {
  p = Math.max(0, Math.min(TOTAL, p));
  const pp = Math.min(p, DURATION);
  const real = toReal(pp);
  document.documentElement.style.setProperty("--t", p.toFixed(3));
  renderSidebar(pp, real);
  renderConversation(pp, real);
  renderComposer(pp);
  if (PB.clock) clockEl.textContent = clock(real);
}

// ---- Scale the window to fit -------------------------------------------
function fit() { stage.style.transform = "scale(" + Math.min(innerWidth / PB.width, innerHeight / PB.height) + ")"; }
addEventListener("resize", fit);
fit();

// ---- Playback ----------------------------------------------------------
let t = 0, playing = !FRAME, last = null;
const playBtn = document.getElementById("play"), bar = document.querySelector("#bar > div"), timeEl = document.getElementById("time");
function ui() {
  playBtn.textContent = playing ? "Pause" : "Play";
  bar.style.width = (100 * t / TOTAL).toFixed(2) + "%";
  timeEl.textContent = t.toFixed(1) + " / " + TOTAL.toFixed(1) + " s";
  shelfBtn.classList.toggle("on", PB.workingShelf);
}
function tick(now) {
  if (last !== null && playing) {
    t += (now - last) / 1000;
    if (t > TOTAL) t = 0;
    render(t);
    ui();
  }
  last = now;
  if (!FRAME) requestAnimationFrame(tick);
}
function seekTo(x) { t = Math.max(0, Math.min(TOTAL, x)); render(t); ui(); }
playBtn.onclick = () => { playing = !playing; ui(); };
// Toggle the Working section, as in T3 Code's settings: the cards glide to
// their new places.
const shelfBtn = document.getElementById("shelf");
function toggleShelf() {
  PB.workingShelf = !PB.workingShelf;
  layouts = layoutTimes.map((p) => ({ p, pos: layoutAt(p) }));
  rowsEl.classList.add("reflow");
  setTimeout(() => rowsEl.classList.remove("reflow"), 550);
  render(t);
  ui();
}
shelfBtn.onclick = toggleShelf;
document.getElementById("bar").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width * TOTAL); };
addEventListener("keydown", (e) => {
  if (e.key === " ") { playing = !playing; ui(); e.preventDefault(); }
  else if (e.key === "ArrowRight") seekTo(t + 5);
  else if (e.key === "ArrowLeft") seekTo(t - 5);
  else if (e.key === "Home") seekTo(0);
  else if (e.key === "w" || e.key === "W") toggleShelf();
});
// For filming: seek, then resolve once the frame is painted.
window.replay = {
  duration: TOTAL,
  seek(x) { seekTo(x); return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))); },
};
if (PARAMS.has("t")) { playing = false; t = Number(PARAMS.get("t")) || 0; } // a still at ?t=SECONDS
document.fonts.ready.then(() => { render(t); ui(); });
render(t);
ui();
if (!FRAME) requestAnimationFrame(tick);
</script>
</body>
</html>
